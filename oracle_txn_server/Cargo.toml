[package]
name = "oracle_txn_server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oracle_txn_server"
path = "src/main.rs"

[features]
# PostgreSQL is the default backend. The Oracle backend (diesel-oci) needs the
# Oracle client libraries at build/run time, so it is opt-in:
#   cargo build -p oracle_txn_server --features oracle
default = ["postgres"]
postgres = []
oracle = ["dep:diesel-oci"]

[dependencies]
endurox-rs = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Diesel ORM for Oracle and PostgreSQL
diesel = { workspace = true, features = ["postgres", "r2d2", "chrono"] }
diesel-oci = { workspace = true, optional = true }
r2d2 = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
dotenv = "0.15"

[build-dependencies]
