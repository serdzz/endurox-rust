; Manual queues used by the durable queue Rust integration test.
; The queue space itself, tmqueue, XA driver, and defaults come from xadmin provision.
[@queue/RM1TMQ]
TESTQ=svcnm=-,autoq=n,waitinit=0,waitretry=0,waitretrymax=0,memonly=n,mode=fifo

[@debug]
rs_dq_client=ndrx=5 file=${NDRX_ULOG}/rs_dq_client.log
